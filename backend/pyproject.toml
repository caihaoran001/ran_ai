[project]
name = "ran-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Ran AI 1.0."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "cryptography>=42,<47",
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.99,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "python-docx>=1.1,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "llama-index-core>=0.14.21",
]

[project.scripts]
ran-ai-api = "app.main:main"
ran-ai-wecom-worker = "app.workers.wecom_bot:main"
ran-ai-scheduler = "app.workers.scheduler:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/wecom_agent_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
