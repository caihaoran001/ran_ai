services:
  rag-eval:
    image: ran-ai-rag-eval:local
    build:
      context: ./backend
      dockerfile: eval/Dockerfile
      args:
        BACKEND_IMAGE: ${RAG_EVAL_BACKEND_IMAGE:-ran-ai-backend:local}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL for RAG evaluation is required}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY for RAG evaluation is required}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_RISK_MODEL: ${AI_RISK_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8000}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-300}
      AI_MAX_CONCURRENT_REQUESTS: "1"
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-15}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY for RAG evaluation is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      FAQ_VECTOR_DISTANCE_THRESHOLD: ${FAQ_VECTOR_DISTANCE_THRESHOLD:-0.35}
      CASE_VECTOR_DISTANCE_THRESHOLD: ${CASE_VECTOR_DISTANCE_THRESHOLD:-0.45}
      WEB_SEARCH_ENABLED: "false"
      QIWEI_ENABLED: "false"
      RAN_AI_RAG_EVAL_MODE: "true"
      RAG_EVAL_GIT_SHA: ${RAG_EVAL_GIT_SHA:-unknown}
      RAG_EVALUATION_REPORTS_PATH: /app/diagnostics/rag-evaluations
      RAG_EVALUATION_DATASET_PATH: /app/diagnostics/rag-evaluations/datasets/dataset.v1.json
    volumes:
      - ./backend/eval:/app/eval:ro
      - ./backend/src:/app/src:ro
      - ./backend/tests/fixtures:/app/tests/fixtures:ro
      - ./diagnostics:/app/diagnostics
