services:
  backend:
    image: ran-ai-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL for Aliyun RDS PostgreSQL is required}
      FRONTEND_PUBLIC_BASE_URL: ${FRONTEND_PUBLIC_BASE_URL:?FRONTEND_PUBLIC_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      BACKEND_ADMIN_API_KEY: ${BACKEND_ADMIN_API_KEY:?BACKEND_ADMIN_API_KEY is required}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_DOCUMENT_MODEL: ${AI_DOCUMENT_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8000}
      AI_DOCUMENT_MAX_TOKENS: ${AI_DOCUMENT_MAX_TOKENS:-50000}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-300}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-10}
      AI_PROMPT_COST_PER_1M_TOKENS: ${AI_PROMPT_COST_PER_1M_TOKENS:-1}
      AI_COMPLETION_COST_PER_1M_TOKENS: ${AI_COMPLETION_COST_PER_1M_TOKENS:-2}
      AI_PROMPT_CACHE_HIT_COST_PER_1M_TOKENS: ${AI_PROMPT_CACHE_HIT_COST_PER_1M_TOKENS:-0.02}
      AI_PEAK_PRICE_MULTIPLIER: ${AI_PEAK_PRICE_MULTIPLIER:-1}
      AI_BALANCE_ALERT_ENABLED: ${AI_BALANCE_ALERT_ENABLED:-false}
      AI_BALANCE_ALERT_THRESHOLD_YUAN: ${AI_BALANCE_ALERT_THRESHOLD_YUAN:-10}
      AI_BALANCE_ALERT_GROUP_ID: ${AI_BALANCE_ALERT_GROUP_ID:-}
      AI_BALANCE_CHECK_INTERVAL_SECONDS: ${AI_BALANCE_CHECK_INTERVAL_SECONDS:-600}
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-15}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-8}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-plus}
      QWEN_IMAGE_TIMEOUT_SECONDS: ${QWEN_IMAGE_TIMEOUT_SECONDS:-180}
      QWEN_PROMPT_COST_UNDER_128K_PER_1M_TOKENS: ${QWEN_PROMPT_COST_UNDER_128K_PER_1M_TOKENS:-2}
      QWEN_COMPLETION_COST_UNDER_128K_PER_1M_TOKENS: ${QWEN_COMPLETION_COST_UNDER_128K_PER_1M_TOKENS:-8}
      QWEN_PROMPT_COST_128K_TO_256K_PER_1M_TOKENS: ${QWEN_PROMPT_COST_128K_TO_256K_PER_1M_TOKENS:-2}
      QWEN_COMPLETION_COST_128K_TO_256K_PER_1M_TOKENS: ${QWEN_COMPLETION_COST_128K_TO_256K_PER_1M_TOKENS:-12}
      QWEN_PROMPT_COST_OVER_256K_PER_1M_TOKENS: ${QWEN_PROMPT_COST_OVER_256K_PER_1M_TOKENS:-4}
      QWEN_COMPLETION_COST_OVER_256K_PER_1M_TOKENS: ${QWEN_COMPLETION_COST_OVER_256K_PER_1M_TOKENS:-24}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      FAQ_VECTOR_DISTANCE_THRESHOLD: ${FAQ_VECTOR_DISTANCE_THRESHOLD:-0.35}
      CASE_VECTOR_DISTANCE_THRESHOLD: ${CASE_VECTOR_DISTANCE_THRESHOLD:-0.45}
      QIWEI_ENABLED: ${QIWEI_ENABLED:-true}
      QIWEI_TOKEN: ${QIWEI_TOKEN:?QIWEI_TOKEN is required}
      QIWEI_GUID: ${QIWEI_GUID:?QIWEI_GUID is required}
      QIWEI_CALLBACK_SECRET: ${QIWEI_CALLBACK_SECRET:?QIWEI_CALLBACK_SECRET is required}
      QIWEI_BASE_URL: ${QIWEI_BASE_URL:-http://manager.qiweapi.com/qiwe}
      QIWEI_BATCH_WINDOW_SECONDS: ${QIWEI_BATCH_WINDOW_SECONDS:-8}
      QIWEI_SHUTDOWN_DRAIN_SECONDS: ${QIWEI_SHUTDOWN_DRAIN_SECONDS:-60}
      CURATED_VIDEO_ENABLED: ${CURATED_VIDEO_ENABLED:-true}
      CURATED_VIDEO_SOURCE_GROUP_ID: ${CURATED_VIDEO_SOURCE_GROUP_ID:-10928203839633338}
      CURATED_VIDEO_SEND_AT: ${CURATED_VIDEO_SEND_AT:-12:00}
      REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
      AGENT_REMINDERS_ENABLED: ${AGENT_REMINDERS_ENABLED:-true}
      REMINDER_CHECK_INTERVAL_SECONDS: ${REMINDER_CHECK_INTERVAL_SECONDS:-30}
      CHECKIN_FOLLOWUP_ENABLED: ${CHECKIN_FOLLOWUP_ENABLED:-false}
      CHECKIN_REWARDS_ENABLED: ${CHECKIN_REWARDS_ENABLED:-false}
      REMINDER_AT: ${REMINDER_AT:-12:00}
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Asia/Shanghai}
      REMINDER_WEEKDAYS: ${REMINDER_WEEKDAYS:-1,2,3,4,5}
      CHURN_RECALL_ENABLED: ${CHURN_RECALL_ENABLED:-false}
      CHURN_RECALL_SILENT_DAYS: ${CHURN_RECALL_SILENT_DAYS:-7}
      CHURN_RECALL_MAX_PER_SILENCE: ${CHURN_RECALL_MAX_PER_SILENCE:-2}
      CHURN_RECALL_WINDOW_START: ${CHURN_RECALL_WINDOW_START:-10:00}
      CHURN_RECALL_WINDOW_END: ${CHURN_RECALL_WINDOW_END:-11:00}
      OUTCOME_SNAPSHOTS_ENABLED: ${OUTCOME_SNAPSHOTS_ENABLED:-true}
      DIAGNOSTICS_HISTORY_PATH: /app/diagnostics/diagnostics_history.json
    volumes:
      - ./diagnostics:/app/diagnostics
      # 入站图片缓存(聊天记录原图)。持久化后容器重建不再丢图，60 天保留期才真正生效。
      - ./wecom_cache:/app/.wecom_cache

  ingress:
    # Shares the backend image at initial rollout, but normal deployments never
    # recreate this container. It keeps running its old, known-good image while
    # the backend tag is rebuilt underneath it.
    image: ran-ai-backend:local
    command: ["uv", "run", "ran-ai-ingress"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL for Aliyun RDS PostgreSQL is required}
      QIWEI_CALLBACK_SECRET: ${QIWEI_CALLBACK_SECRET:?QIWEI_CALLBACK_SECRET is required}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SERVER_API_BASE_URL: http://backend:8000/api
      # C 端公开入口(问卷展示/提交/短链跳转)直连常驻 ingress:8001，避开 backend 重启导致的 502。
      SERVER_INGRESS_BASE_URL: http://ingress:8001/api
      BACKEND_ADMIN_API_KEY: ${BACKEND_ADMIN_API_KEY:?BACKEND_ADMIN_API_KEY is required}
      FRONTEND_PUBLIC_BASE_URL: ${FRONTEND_PUBLIC_BASE_URL:?FRONTEND_PUBLIC_BASE_URL is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      - backend

  website:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - /opt/humanburning-site/current:/usr/share/nginx/html:ro
      - /opt/humanburning-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks:
      - website
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_SITE_ADDRESS: ${PUBLIC_SITE_ADDRESS:?PUBLIC_SITE_ADDRESS is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - frontend
      - backend
      - ingress
      - website
    networks:
      - default
      - website
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  website:
    internal: true
