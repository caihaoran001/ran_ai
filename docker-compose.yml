services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: ran-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ran_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ran_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ran_ai_password}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ran_ai} -d ${POSTGRES_DB:-ran_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ran-ai-backend
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${BACKEND_ENVIRONMENT:-docker}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ran_ai}:${POSTGRES_PASSWORD:-ran_ai_password}@postgres:5432/${POSTGRES_DB:-ran_ai}
      BACKEND_ADMIN_API_KEY: ${BACKEND_ADMIN_API_KEY:-change-me-internal-api-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
      AI_PROMPT_COST_PER_1M_TOKENS: ${AI_PROMPT_COST_PER_1M_TOKENS:-1.5}
      AI_COMPLETION_COST_PER_1M_TOKENS: ${AI_COMPLETION_COST_PER_1M_TOKENS:-4.5}
      AI_PROMPT_CACHE_HIT_COST_PER_1M_TOKENS: ${AI_PROMPT_CACHE_HIT_COST_PER_1M_TOKENS:-0.05}
      AI_PREMIUM_MODELS: ${AI_PREMIUM_MODELS:-deepseek-v4-pro}
      AI_PREMIUM_PROMPT_COST_PER_1M_TOKENS: ${AI_PREMIUM_PROMPT_COST_PER_1M_TOKENS:-4.5}
      AI_PREMIUM_COMPLETION_COST_PER_1M_TOKENS: ${AI_PREMIUM_COMPLETION_COST_PER_1M_TOKENS:-13.5}
      AI_PREMIUM_PROMPT_CACHE_HIT_COST_PER_1M_TOKENS: ${AI_PREMIUM_PROMPT_CACHE_HIT_COST_PER_1M_TOKENS:-0.15}
      AI_PEAK_PRICE_MULTIPLIER: ${AI_PEAK_PRICE_MULTIPLIER:-2}
      QWEN_PROMPT_COST_UNDER_128K_PER_1M_TOKENS: ${QWEN_PROMPT_COST_UNDER_128K_PER_1M_TOKENS:-0.8}
      QWEN_COMPLETION_COST_UNDER_128K_PER_1M_TOKENS: ${QWEN_COMPLETION_COST_UNDER_128K_PER_1M_TOKENS:-4.8}
      QWEN_PROMPT_COST_128K_TO_256K_PER_1M_TOKENS: ${QWEN_PROMPT_COST_128K_TO_256K_PER_1M_TOKENS:-2}
      QWEN_COMPLETION_COST_128K_TO_256K_PER_1M_TOKENS: ${QWEN_COMPLETION_COST_128K_TO_256K_PER_1M_TOKENS:-12}
      QWEN_PROMPT_COST_OVER_256K_PER_1M_TOKENS: ${QWEN_PROMPT_COST_OVER_256K_PER_1M_TOKENS:-4}
      QWEN_COMPLETION_COST_OVER_256K_PER_1M_TOKENS: ${QWEN_COMPLETION_COST_OVER_256K_PER_1M_TOKENS:-24}
      DIAGNOSTICS_HISTORY_PATH: /app/diagnostics/diagnostics_history.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
      - ./generated_documents:/app/generated_documents
      - ./diagnostics:/app/diagnostics

  frontend:
    build:
      context: ./frontend
    container_name: ran-ai-frontend
    restart: unless-stopped
    environment:
      SERVER_API_BASE_URL: http://backend:8000/api
      BACKEND_ADMIN_API_KEY: ${BACKEND_ADMIN_API_KEY:-change-me-internal-api-key}
      FRONTEND_PUBLIC_BASE_URL: ${FRONTEND_PUBLIC_BASE_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data:
